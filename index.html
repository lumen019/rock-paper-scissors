<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <div class="buttons">
            <button id="rockBtn">Rock</button>
            <button id="paperBtn">Paper</button>
        <button id="scissorBtn">Scissor</button>
        </div>
        <div class="instructions">Choose Rock, Paper, or Scissors. First to score 5 points wins the game.</div>
        <div id="scoreCounter">
            <div id="humanScore"></div>
            <div id="computerScore"></div>
            <div id="gameRound"></div>
        </div>
    
        <div id="msgContainer"></div>
        <h2 id="winner"></h2>
    </div>
</body>
</html>
